appName: "onix-generic-bap"
log:
  level: debug
  destinations:
    - type: stdout
  contextKeys:
    - transactionId
    - messageId
http:
  port: 8081
  timeout:
    read: 30
    write: 30
    idle: 30
pluginManager:
  root: ./plugins
  becknConstants:
    disableRemoteRefresh: true

modules:
  # ─────────────────────────────────────────────────────────────────
  # BAP Receiver  — accepts on_* callbacks from BPPs
  # Listens at:  http://localhost:8081/bap/receiver/
  # ─────────────────────────────────────────────────────────────────
  - name: bapTxnReceiver
    path: /bap/receiver/
    handler:
      type: std
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            timeout: 10
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
            # Testnet sandbox subscriber registered on beckn.one/testnet
            # Replace with your own registered subscriber ID and keys for production
            subscriberId: cnn_beck_bap.ohc.network
            keyId: 76EU8DaWNyY1t6ma7DyPcdBGLqMVGLTbLx7n6dq4q6HpAxZTmbA5aP
            signingPrivateKey: VmqqllaFJlR92A6tJUrrnCEVSDgLcfMduoiLoQVE/g8=
            signingPublicKey: UZG3/nB3eIKBhtYhSlyScvefhe+Q2AG2+lwhC/knp8U=
            encrPrivateKey: VmqqllaFJlR92A6tJUrrnCEVSDgLcfMduoiLoQVE/g8=
            encrPublicKey: UZG3/nB3eIKBhtYhSlyScvefhe+Q2AG2+lwhC/knp8U=
        cache:
          id: cache
          config:
            addr: redis:6379
        schemaValidator:
          id: schemav2validator
          config:
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io,schema.nfh.global"
        signValidator:
          id: signvalidator
        router:
          id: router
          config:
            routingConfig: ./config/generic-routing-BAPReceiver.yaml
        signer:
          id: signer
        payloadStore:
          id: payloadstore
          config:
            ttl: "24h"
            indexTTL: "25h"
            storeSignature: "true"
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transactionId,messageId
              role: bap
      steps:
        - validateSign
        - addRoute
        - validateSchema
        - signAck

  # ─────────────────────────────────────────────────────────────────
  # BAP Caller  — forwards outbound BAP requests to BPPs / CDS
  # Listens at:  http://localhost:8081/bap/caller/
  # Postman bap_adapter_url = http://localhost:8081/bap/caller
  # ─────────────────────────────────────────────────────────────────
  - name: bapTxnCaller
    path: /bap/caller/
    handler:
      type: std
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            timeout: 10
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: cnn_beck_bap.ohc.network
            keyId: 76EU8DaWNyY1t6ma7DyPcdBGLqMVGLTbLx7n6dq4q6HpAxZTmbA5aP
            signingPrivateKey: VmqqllaFJlR92A6tJUrrnCEVSDgLcfMduoiLoQVE/g8=
            signingPublicKey: UZG3/nB3eIKBhtYhSlyScvefhe+Q2AG2+lwhC/knp8U=
            encrPrivateKey: VmqqllaFJlR92A6tJUrrnCEVSDgLcfMduoiLoQVE/g8=
            encrPublicKey: UZG3/nB3eIKBhtYhSlyScvefhe+Q2AG2+lwhC/knp8U=
        cache:
          id: cache
          config:
            addr: redis:6379
        schemaValidator:
          id: schemav2validator
          config:
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io,schema.nfh.global"
        router:
          id: router
          config:
            routingConfig: ./config/generic-routing-BAPCaller.yaml
        signer:
          id: signer
        signValidator:
          id: signvalidator
        payloadStore:
          id: payloadstore
          config:
            ttl: "24h"
            indexTTL: "25h"
            storeSignature: "true"
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transactionId,messageId
              role: bap
      steps:
        - addRoute
        - storePayload
        - validateSchema
        - sign
        - validateAckSign
